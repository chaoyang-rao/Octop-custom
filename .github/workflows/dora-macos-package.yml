name: Dora standalone Mac source checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'chaoyang-rao/Octop-custom'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop-companion/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: npm ci --prefix desktop-companion
      - run: npm test --prefix desktop-companion
      - name: Verify frozen program inputs
        run: |
          python3 scripts/custom/sync_octop_source.py --check
          python3 scripts/custom/sync_dashboard.py --check
      - name: Build mini-client source
        run: npm run build --prefix desktop-companion
      - name: Compile both native architectures without internal artwork
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p desktop-companion/build
          for arch in arm64 x86_64; do
            xcrun swiftc -swift-version 5 -parse-as-library -sdk "$sdk" \
              -target "$arch-apple-macosx13.0" \
              -framework AppKit -framework WebKit -framework AVFoundation \
              -framework Speech -framework Carbon \
              desktop-companion/macos/*.swift -o "desktop-companion/build/Dora-$arch"
          done
