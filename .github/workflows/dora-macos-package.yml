name: Dora standalone Mac package

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'chaoyang-rao/Octop-custom'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop-companion/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/src/go.mod
          cache: false
      - name: Verify signed update helper and native rollback
        working-directory: desktop/src
        run: go test ./internal/clientupdate ./cmd/client-updater
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false
      - run: npm ci --prefix desktop-companion
      - run: npm test --prefix desktop-companion
      - name: Verify frozen program inputs
        run: |
          python3 scripts/custom/sync_octop_source.py --check
          python3 scripts/custom/sync_dashboard.py --check
      - name: Build mini-client source
        run: npm run build --prefix desktop-companion
      - name: Verify scrolling in native WebKit after history message IDs change
        run: |
          mkdir -p desktop-companion/build
          node desktop-companion/tests/prepare-native-scroll-fixture.mjs desktop-companion/build/native-scroll-bridge.js
          xcrun swiftc -swift-version 5 -framework AppKit -framework WebKit desktop-companion/tests/native-scroll.swift -o desktop-companion/build/native-scroll-check
          desktop-companion/build/native-scroll-check desktop-companion/dist/web/index.html desktop-companion/build/native-scroll-bridge.js desktop-companion/tests/native-scroll.js 350 510
          desktop-companion/build/native-scroll-check desktop-companion/dist/web/index.html desktop-companion/build/native-scroll-bridge.js desktop-companion/tests/native-scroll.js 456 684
          desktop-companion/build/native-scroll-check desktop-companion/dist/web/index.html desktop-companion/build/native-scroll-bridge.js desktop-companion/tests/native-scroll.js 350 920
      - name: Compile both native architectures without internal artwork
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p desktop-companion/build
          for arch in arm64 x86_64; do
            xcrun swiftc -swift-version 5 -parse-as-library -sdk "$sdk" \
              -target "$arch-apple-macosx13.0" \
              -framework AppKit -framework WebKit -framework AVFoundation \
              -framework Speech -framework Carbon -framework QuartzCore \
              -framework IOKit -framework ApplicationServices \
              desktop-companion/macos/*.swift desktop-companion/macos/KuroCat/*.swift \
              -o "desktop-companion/build/Dora-$arch"
          done
          arch=$(uname -m)
          "desktop-companion/build/Dora-$arch" --verify-kurocat desktop-companion/build/kurocat-verification
      - name: Verify edge docking without internal artwork
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library \
            desktop-companion/macos/PetEdgeDocking.swift \
            desktop-companion/tests/edge-docking.swift \
            -o desktop-companion/build/edge-docking-check
          desktop-companion/build/edge-docking-check
      - name: Verify chat title dragging and web controls
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library \
            -framework AppKit -framework WebKit \
            desktop-companion/macos/GlassChatWebView.swift \
            desktop-companion/tests/chat-window-drag.swift \
            -o desktop-companion/build/chat-window-drag-check
          desktop-companion/build/chat-window-drag-check
      - name: Verify fixed character scale without internal artwork
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library \
            -framework AppKit -framework QuartzCore -framework IOKit -framework ApplicationServices \
            desktop-companion/macos/SecurityCore.swift \
            desktop-companion/macos/PetWindow.swift \
            desktop-companion/macos/KuroCatIntegration.swift \
            desktop-companion/macos/KuroCat/*.swift \
            desktop-companion/macos/PetSizing.swift \
            desktop-companion/macos/PetDragMotion.swift \
            desktop-companion/macos/PetEdgeDocking.swift \
            desktop-companion/macos/PetSpriteDrawing.swift \
            desktop-companion/macos/PetPresentation.swift \
            desktop-companion/tests/pose-scale.swift \
            -o desktop-companion/build/pose-scale-check
          desktop-companion/build/pose-scale-check
      - name: Verify chat controls and SSE decoding
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library \
            desktop-companion/macos/SecurityCore.swift \
            desktop-companion/macos/ChatTransport.swift \
            desktop-companion/macos/BackendClient.swift \
            desktop-companion/tests/chat-transport.swift \
            -o desktop-companion/build/chat-transport-check
          desktop-companion/build/chat-transport-check
      - name: Prepare locked independent engine archives
        run: uv run --no-project python desktop-companion/scripts/prepare_engine.py
      - name: Build and verify universal Mac installer
        run: uv run --no-project python desktop-companion/scripts/build_macos.py --skip-web --output-dir "${{ runner.temp }}/dora-macos"
      - name: Write installer checksums
        env:
          INSTALLER_DIR: ${{ runner.temp }}/dora-macos
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['INSTALLER_DIR'])
          files = sorted([*root.glob('*.dmg'), *root.glob('Dora-update-*.zip')])
          assert len(files) == 3
          (root / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dora-macos-universal
          path: |
            ${{ runner.temp }}/dora-macos/*.dmg
            ${{ runner.temp }}/dora-macos/Dora-update-*.zip
            ${{ runner.temp }}/dora-macos/SHA256SUMS.txt
            ${{ runner.temp }}/dora-macos/build-report.json
          if-no-files-found: error
