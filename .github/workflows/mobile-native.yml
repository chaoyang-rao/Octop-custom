name: Octop Mobile native builds

on:
  push:
    branches: [custom/main]
    paths:
      - 'clients/mobile/**'
      - '.github/workflows/mobile-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: octop-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.repository == 'chaoyang-rao/Octop-custom'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Compile iOS app and Live Activity extension without signing
        run: >-
          xcodebuild -project clients/mobile/ios/OctopMobile.xcodeproj
          -scheme OctopMobile -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -jobs 1
          -derivedDataPath "$RUNNER_TEMP/octop-mobile-ios"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Archive simulator app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "$RUNNER_TEMP/octop-mobile-ios/Build/Products/Debug-iphonesimulator/OctopMobile.app"
          "$RUNNER_TEMP/OctopMobile-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OctopMobile-iOS-Simulator
          path: ${{ runner.temp }}/OctopMobile-iOS-Simulator.zip
          if-no-files-found: error

  android:
    if: github.repository == 'chaoyang-rao/Octop-custom'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: clients/mobile/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile against the runner's Android SDK
        run: gradle --no-daemon --max-workers=1 :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: OctopMobile-Android-Debug
          path: |
            clients/mobile/android/app/build/outputs/apk/debug/*.apk
            clients/mobile/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
